version: "3.9"

services:
  backdoor-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BACKDOOR_DEBUG=true
      - BACKDOOR_HOST=0.0.0.0
      - BACKDOOR_PORT=8000
      - BACKDOOR_DATA_DIR=/app/data
    volumes:
      - ../data:/app/data
    restart: unless-stopped

